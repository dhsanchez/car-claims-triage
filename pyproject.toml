[project]
name = "triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dhsanchez", email = "dherrsan26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.146.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
triage = "triage:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
eval = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]
